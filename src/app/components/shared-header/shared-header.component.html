<header
  class="w-full transition-all duration-300 ease-in-out select-none"
  [ngClass]="isScrolled
    ? 'bg-emerald-950/85 backdrop-blur-xl border-b border-white/10 shadow-lg shadow-black/15 py-2.5 px-5'
    : 'bg-transparent py-4 px-6'"
>
  <div class="flex justify-between items-center max-w-[480px] mx-auto">
    <!-- Brand / Logo & Titre -->
    <div class="flex items-center gap-2.5 transition-all duration-300">
      <div
        class="rounded-2xl bg-white flex items-center justify-center border border-white/20 shadow-md transition-all duration-300 overflow-hidden"
        [ngClass]="isScrolled ? 'w-8 h-8 p-1' : 'w-10 h-10 p-1.5'"
      >
        <img
          src="assets/images/logo-symbole-trans.png"
          alt="Logo Transito"
          class="w-full h-full object-contain transition-transform duration-300"
        />
      </div>

      <div class="flex flex-col">
        <span
          class="font-title-lg font-black tracking-tight uppercase text-white transition-all duration-300"
          [ngClass]="isScrolled ? 'text-sm' : 'text-base'"
        >
          Transito
        </span>
        <span
          *ngIf="isScrolled && pageTitle"
          class="text-[10px] font-bold text-emerald-300/90 tracking-wide uppercase leading-none animate-fade-in"
        >
          {{ pageTitle }}
        </span>
      </div>
    </div>

    <!-- Actions (Cloche de notifications) -->
    <div *ngIf="showNotifications" class="flex items-center gap-2">
      <button
        (click)="openNotifications()"
        aria-label="Notifications"
        class="text-white transition-all duration-300 flex items-center justify-center active:scale-90 relative border border-white/15 rounded-xl shadow-sm hover:bg-white/20"
        [ngClass]="isScrolled
          ? 'w-9 h-9 bg-white/10 backdrop-blur-md'
          : 'w-10 h-10 bg-white/10 backdrop-blur-sm'"
      >
        <i class="fa-solid fa-bell text-sm transition-transform duration-300"></i>
        <!-- Pastille animée non lue -->
        <span
          *ngIf="hasUnreadNotifications"
          class="absolute top-2 right-2 w-2 h-2 bg-amber-400 rounded-full ring-2 ring-emerald-900 animate-pulse"
        ></span>
      </button>
    </div>
  </div>
</header>
