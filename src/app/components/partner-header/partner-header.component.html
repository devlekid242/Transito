<ion-header class="ion-no-border">
  <div class="bg-primary flex items-center justify-between px-container-padding h-16 w-full max-w-[480px] mx-auto sticky top-0 z-50 shadow-sm border-b border-surface-variant/40">
    <div class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center backdrop-blur-md border border-white/10 shadow-inner">
      <i class="fa-solid fa-bus-simple text-xl text-white"></i>
    </div>
    <h1 class="text-base font-bold text-on-primary flex-1 text-center">
      {{ title }}
    </h1>
    <button
      (click)="openNotifications()"
      aria-label="Notifications"
      class="hover:bg-white/15 text-white transition-all duration-200 p-2.5 rounded-xl flex items-center justify-center active:scale-95 bg-white/5 backdrop-blur-sm relative border border-white/10"
    >
      <i class="fa-solid fa-bell text-base"></i>
      <span
        class="absolute top-2.5 right-2.5 w-2 h-2 bg-amber-400 rounded-full ring-2 ring-primary animate-pulse"
      ></span>
    </button>
  </div>
</ion-header>
