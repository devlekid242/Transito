<ion-header class="ion-no-border">
  <div
    class="bg-surface-container-lowest flex justify-between items-center px-container-padding h-16 w-full border-b border-surface-variant/40"
  >
    <span class="font-sans text-lg font-bold text-secondary tracking-tight"
      >QrCode</span
    >
    <button
      (click)="close()"
      class="text-secondary hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-full"
    >
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>
</ion-header>

<ion-content class="bg-background">
  <div class="w-full bg-surface min-h-screen mx-auto pt-24">
    <div *ngIf="isLoading" class="flex flex-col gap-stack-lg py-2">
      <section
        class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_20px_rgba(30,41,59,0.05)] border border-surface-variant flex flex-col items-center"
      >
        <div
          class="h-5 w-36 bg-surface-container rounded animate-pulse mb-4"
        ></div>
        <div
          class="w-64 h-64 bg-surface-container rounded-xl animate-pulse mb-4"
        ></div>
        <div class="h-3 w-48 bg-surface-container rounded animate-pulse"></div>
      </section>
    </div>

    <!-- QR Code Section -->
    <div
      *ngIf="!isLoading && ticketDetails"
      class="flex flex-col justify-center items-center gap-stack-lg py-2"
    >
      <!-- Code QR -->
      <div
        class="p-3 bg-white rounded-2xl shadow-sm border border-slate-100 mb-3"
      >
        <!-- booking-form.page.html -->
        <qrcode
          [qrdata]="qrCodeUrl || 'N/A'"
          [width]="256"
          elementType="canvas"
        ></qrcode>
      </div>
      <p class="text-sm text-on-surface-variant text-center">
        Présentez ce code à l'embarquement
      </p>
    </div>
  </div>
</ion-content>
