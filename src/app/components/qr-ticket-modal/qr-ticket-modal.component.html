<ion-header class="ion-no-border">
  <div
    class="bg-surface-container-lowest flex justify-between items-center px-container-padding h-16 w-full border-b border-surface-variant/40"
  >
    <span class="font-sans text-lg font-bold text-secondary tracking-tight"
      >QrCode</span
    >
    <button
      (click)="close()"
      class="text-secondary hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-full"
    >
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>
</ion-header>

<ion-content class="bg-background">
  <div class="w-full bg-surface min-h-screen mx-auto pt-24">
    <div *ngIf="tickets.length > 1" class="px-5 mb-5 flex gap-2 overflow-x-auto">
      <button
        *ngFor="let ticket of tickets; let index = index"
        (click)="selectedTicketIndex = index"
        [class.bg-primary]="selectedTicketIndex === index"
        [class.text-white]="selectedTicketIndex === index"
        class="rounded-xl border border-outline-variant px-4 py-2 text-sm whitespace-nowrap"
      >
        {{ ticket.passengerName || ticket.ticketNumber }} · Siège {{ ticket.seatNumber }}
      </button>
    </div>

    <div *ngIf="selectedTicket as ticket" class="flex flex-col items-center gap-4 px-5">
      <p class="font-semibold text-on-surface">
        {{ ticket.passengerName }} · Siège {{ ticket.seatNumber }}
      </p>
      <div
        *ngIf="canShowSelectedQr"
        class="p-3 bg-white rounded-2xl shadow-sm border border-slate-100 mb-3"
      >
        <qrcode
          [qrdata]="ticket.qrCodeToken!"
          [width]="256"
          elementType="canvas"
        ></qrcode>
      </div>
      <p *ngIf="canShowSelectedQr" class="text-sm text-on-surface-variant text-center">
        Présentez ce code à l'embarquement
      </p>
      <p *ngIf="!canShowSelectedQr" class="text-sm text-on-surface-variant text-center">
        {{ selectedTicketUnavailableMessage }}
      </p>
    </div>

    <p *ngIf="tickets.length === 0" class="px-6 text-center text-on-surface-variant">
      {{ emptyTicketsMessage }}
    </p>
  </div>
</ion-content>
