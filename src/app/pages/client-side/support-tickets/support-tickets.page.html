<!-- En-tête (Style retour circulaire & bouton d'action) -->
<ion-header class="ion-no-border">
  <div class="bg-white flex items-center justify-between px-6 h-16 max-w-md mx-auto sticky top-0 z-40 shadow-[0_4px_20px_rgba(0,0,0,0.04)]">
    <button (click)="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    
    <h1 class="text-lg font-bold text-gray-900">Mes Demandes</h1>
    
    <button (click)="createNewTicket()" class="w-10 h-10 flex items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
      <i class="fa-solid fa-plus text-base"></i>
    </button>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="bg-white">
  <div class="w-full max-w-md mx-auto px-6 py-6 pb-28 min-h-full flex flex-col gap-6">

    <!-- ==================== ÉTAT : CHARGEMENT (SKELETON) ==================== -->
    <ng-container *ngIf="isLoading">
      <!-- Skeleton : Filtres -->
      <section class="flex gap-2 overflow-x-auto pb-1" aria-hidden="true">
        <span *ngFor="let i of skeletonFilterItems" class="skeleton-block h-9 rounded-full flex-shrink-0" [style.width.px]="i"></span>
      </section>

      <!-- Skeleton : Liste des tickets -->
      <section class="flex flex-col gap-4" aria-hidden="true">
        <div *ngFor="let i of skeletonTicketItems" class="skeleton-card rounded-2xl p-4 border border-gray-100 flex flex-col gap-3">
          <div class="flex items-start gap-3">
            <span class="skeleton-block w-11 h-11 rounded-full flex-shrink-0"></span>
            <div class="flex-1 flex flex-col gap-2">
              <span class="skeleton-block h-4 w-3/4 rounded"></span>
              <span class="skeleton-block h-3 w-full rounded"></span>
              <div class="flex gap-2 mt-1">
                <span class="skeleton-block h-5 w-16 rounded-full"></span>
                <span class="skeleton-block h-5 w-16 rounded-full"></span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </ng-container>

    <!-- ==================== ÉTAT : CONTENU CHARGÉ ==================== -->
    <ng-container *ngIf="!isLoading">
      
      <!-- Filtres sous forme de pilules modernes -->
      <section class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
        <button
          (click)="setFilter('all')"
          [ngClass]="selectedFilter === 'all' ? 'bg-primary text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
          class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-200"
        >
          Tous ({{ tickets.length }})
        </button>
        <button
          (click)="setFilter('open')"
          [ngClass]="selectedFilter === 'open' ? 'bg-primary text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
          class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-200 flex items-center gap-1.5"
        >
          Ouverts
          <span class="px-1.5 py-0.5 rounded-full text-[10px]" [ngClass]="selectedFilter === 'open' ? 'bg-white/20 text-white' : 'bg-primary/10 text-primary'">
            {{ countByStatus('open') }}
          </span>
        </button>
        <button
          (click)="setFilter('pending')"
          [ngClass]="selectedFilter === 'pending' ? 'bg-amber-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
          class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-200 flex items-center gap-1.5"
        >
          En attente
          <span class="px-1.5 py-0.5 rounded-full text-[10px]" [ngClass]="selectedFilter === 'pending' ? 'bg-white/20 text-white' : 'bg-amber-500/10 text-amber-600'">
            {{ countByStatus('pending') }}
          </span>
        </button>
        <button
          (click)="setFilter('answered')"
          [ngClass]="selectedFilter === 'answered' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
          class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-200 flex items-center gap-1.5"
        >
          Répondus
          <span class="px-1.5 py-0.5 rounded-full text-[10px]" [ngClass]="selectedFilter === 'answered' ? 'bg-white/20 text-white' : 'bg-emerald-600/10 text-emerald-600'">
            {{ countByStatus('answered') }}
          </span>
        </button>
      </section>

      <!-- Liste des cartes de tickets -->
      <section class="flex flex-col gap-3">
        <div
          *ngFor="let ticket of filteredTickets"
          (click)="viewTicketDetails(ticket)"
          class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 transition-all active:scale-[0.99] cursor-pointer hover:border-primary/50"
        >
          <div class="flex items-start gap-3.5">
            <!-- Badge Icône circulaire -->
            <div
              class="w-11 h-11 rounded-full flex items-center justify-center shrink-0 mt-0.5"
              [ngClass]="{
                'bg-primary/10 text-primary': ticket.status === 'open',
                'bg-amber-500/10 text-amber-500': ticket.status === 'pending',
                'bg-emerald-500/10 text-emerald-600': ticket.status === 'answered',
                'bg-gray-100 text-gray-400': ticket.status === 'closed'
              }"
            >
              <i [class]="getStatusIcon(ticket.status)" class="text-base"></i>
            </div>

            <!-- Détails du ticket -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2 mb-1">
                <h3 class="font-bold text-gray-900 text-base truncate">
                  {{ ticket.subject }}
                </h3>
                <i class="fa-solid fa-chevron-right text-gray-300 text-xs shrink-0"></i>
              </div>

              <p class="text-xs text-gray-500 mb-3 line-clamp-2 leading-relaxed">
                {{ ticket.message }}
              </p>

              <!-- Tags de Statut et Priorité -->
              <div class="flex items-center justify-between border-t border-gray-100 pt-3 mt-1">
                <div class="flex items-center gap-2">
                  <span
                    class="text-[11px] font-bold px-2.5 py-1 rounded-full"
                    [ngClass]="{
                      'bg-primary/10 text-primary': ticket.status === 'open',
                      'bg-amber-500/10 text-amber-600': ticket.status === 'pending',
                      'bg-emerald-500/10 text-emerald-600': ticket.status === 'answered',
                      'bg-gray-100 text-gray-500': ticket.status === 'closed'
                    }"
                  >
                    {{ getStatusLabel(ticket.status) }}
                  </span>
                  
                  <span
                    class="text-[11px] font-semibold px-2.5 py-1 rounded-full"
                    [ngClass]="{
                      'bg-red-500/10 text-red-600': ticket.priority === 'critical',
                      'bg-amber-500/10 text-amber-600': ticket.priority === 'high',
                      'bg-primary/10 text-primary': ticket.priority === 'medium',
                      'bg-gray-100 text-gray-500': ticket.priority === 'low'
                    }"
                  >
                    {{ getPriorityLabel(ticket.priority) }}
                  </span>
                </div>

                <span class="text-[11px] font-medium text-gray-400">
                  {{ ticket.createdAt | date: 'dd/MM/yyyy' }}
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- État vide -->
        <div *ngIf="filteredTickets.length === 0" class="flex flex-col items-center justify-center py-12 text-center">
          <div class="w-16 h-16 rounded-full bg-gray-50 text-gray-400 flex items-center justify-center mb-4">
            <i class="fa-solid fa-inbox text-2xl"></i>
          </div>
          <p class="text-gray-900 font-bold text-base mb-1">Aucun ticket trouvé</p>
          <p class="text-gray-400 text-xs">Vos demandes d'assistance apparaîtront ici.</p>
        </div>
      </section>

      <!-- Bouton d'action principal en bas -->
      <div class="mt-4">
        <button
          *ngIf="filteredTickets.length === 0"
          (click)="createNewTicket()"
          class="w-full bg-primary text-white font-bold py-3.5 rounded-[9px] shadow-sm transition-all flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-plus text-sm"></i>
          <span>Créer une nouvelle demande</span>
        </button>
      </div>

    </ng-container>
  </div>
</ion-content>
