<ion-header class="ion-no-border">
  <div class="bg-white flex items-center justify-between px-6 h-16 max-w-md mx-auto sticky top-0 z-40 shadow-[0_4px_20px_rgba(0,0,0,0.04)]">
    <button (click)="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1 class="text-lg font-bold text-gray-900">Mes informations</h1>
    <div class="w-10"></div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="bg-white">
  <div class="w-full max-w-md mx-auto px-6 py-6 pb-28 min-h-full">

    <!-- ===================== SKELETON LOADER ===================== -->
    <div *ngIf="isLoading" class="flex flex-col gap-8">
      <div *ngFor="let section of [1,2]" class="flex flex-col gap-4">
        <div class="h-4 bg-gray-100 rounded w-40 mb-2"></div>
        <div class="h-14 bg-gray-100 rounded-2xl w-full"></div>
        <div class="h-14 bg-gray-100 rounded-2xl w-full"></div>
      </div>
    </div>

    <!-- ===================== FORMULAIRE ===================== -->
    <form *ngIf="!isLoading" [formGroup]="userForm" (ngSubmit)="saveChanges()" class="flex flex-col gap-8">

      <!-- Section Informations de base -->
      <section class="flex flex-col gap-4">
        <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
            <i class="fa-solid fa-user text-xs"></i>
          </div>
          Informations de base
        </h2>

        <!-- Nom complet -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider ml-1">Nom complet</label>
          <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3">
            <i class="fa-solid fa-user text-gray-400 text-sm"></i>
            <input type="text" formControlName="fullName" placeholder="Votre nom complet" class="w-full bg-transparent border-0 py-3 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          </div>
          <span *ngIf="userForm.get('fullName')?.invalid && userForm.get('fullName')?.touched" class="text-[11px] text-red-500 font-bold ml-1">Au moins 3 caractères requis.</span>
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider ml-1">Email</label>
          <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3">
            <i class="fa-solid fa-envelope text-gray-400 text-sm"></i>
            <input type="email" formControlName="email" placeholder="votre@email.com" class="w-full bg-transparent border-0 py-3 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          </div>
          <span *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="text-[11px] text-red-500 font-bold ml-1">Email invalide.</span>
        </div>
      </section>

      <!-- Section Localisation -->
      <section class="flex flex-col gap-4">
        <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
            <i class="fa-solid fa-location-dot text-xs"></i>
          </div>
          Localisation
        </h2>

        <!-- Ville -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider ml-1">Ville de résidence</label>
          <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3">
            <i class="fa-solid fa-city text-gray-400 text-sm"></i>
            <input type="text" formControlName="villeResidence" placeholder="Ex: Pointe-Noire" class="w-full bg-transparent border-0 py-3 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          </div>
        </div>

        <!-- Quartier -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider ml-1">Quartier</label>
          <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3">
            <i class="fa-solid fa-map-pin text-gray-400 text-sm"></i>
            <input type="text" formControlName="quartier" placeholder="Votre quartier" class="w-full bg-transparent border-0 py-3 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          </div>
        </div>
      </section>

      <!-- Section Contact d'urgence (Agent) -->
      <section *ngIf="isAgent" class="flex flex-col gap-4 border-t border-gray-100 pt-6">
        <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-amber-500/10 text-amber-600 flex items-center justify-center">
            <i class="fa-solid fa-user-shield text-xs"></i>
          </div>
          Contact d'urgence
        </h2>

        <div class="flex flex-col gap-1.5">
          <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-amber-500 focus-within:ring-4 focus-within:ring-amber-500/10 transition-all gap-3">
            <i class="fa-solid fa-address-card text-gray-400 text-sm"></i>
            <input type="text" formControlName="emergencyContactName" placeholder="Nom du contact" class="w-full bg-transparent border-0 py-3 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-amber-500 focus-within:ring-4 focus-within:ring-amber-500/10 transition-all gap-3">
            <i class="fa-solid fa-phone text-gray-400 text-sm"></i>
            <input type="tel" formControlName="emergencyContactPhone" placeholder="Téléphone du contact" class="w-full bg-transparent border-0 py-3 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          </div>
        </div>
      </section>

      <!-- Boutons -->
      <section class="flex flex-col gap-3 mt-4">
        <button type="submit" [disabled]="userForm.invalid || isSaving" class="w-full bg-primary text-white font-bold py-3.5 rounded-[9px] shadow-sm transition-all active:scale-[0.98] disabled:opacity-50 flex items-center justify-center gap-2">
          <span *ngIf="!isSaving">Enregistrer les modifications</span>
          <ion-spinner *ngIf="isSaving" name="dots" color="light"></ion-spinner>
        </button>
      </section>

    </form>
  </div>
</ion-content>
