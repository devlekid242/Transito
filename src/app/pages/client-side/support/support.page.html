<ion-header class="ion-no-border">
  <div
    class="bg-surface-container-lowest flex justify-between items-center px-container-padding py-3 sticky top-0 z-40 shadow-sm border-b border-surface-variant/40"
  >
    <button
      (click)="goBack()"
      class="flex items-center gap-2 text-secondary hover:bg-surface-container-low transition-colors duration-200 px-2 py-1.5 rounded-lg active-scale"
    >
      <i class="fa-solid fa-arrow-left"></i>
      <span class="text-body-md font-semibold">Retour</span>
    </button>
    <div class="font-sans text-lg font-bold text-secondary">Support client</div>
    <div class="w-10"></div>
  </div>
</ion-header>

<ion-content class="bg-background">
  <main
    class="w-full max-w-[480px] mx-auto px-container-padding py-stack-lg pb-24"
  >
    <section
      class="bg-surface-container-lowest rounded-2xl border border-surface-variant shadow-[0_4px_20px_rgba(15,23,42,0.05)] overflow-hidden"
    >
      <div
        class="p-stack-md border-b border-surface-variant/40 bg-surface-container-lowest"
      >
        <h2 class="text-lg font-semibold text-on-surface">
          Contacter le support
        </h2>
        <p class="text-sm text-on-surface-variant">
          Nous sommes là pour vous aider 24/7.
        </p>
      </div>

      <div class="p-stack-md flex flex-col gap-4">
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-on-surface-variant"
            >Nom</label
          >
          <input
            [(ngModel)]="name"
            class="bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface outline-none focus:border-primary focus:ring-1 focus:ring-primary"
            type="text"
            placeholder="Votre nom"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-on-surface-variant"
            >Email</label
          >
          <input
            [(ngModel)]="email"
            class="bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface outline-none focus:border-primary focus:ring-1 focus:ring-primary"
            type="email"
            placeholder="Votre email"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-on-surface-variant"
            >Sujet</label
          >
          <input
            [(ngModel)]="subject"
            class="bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface outline-none focus:border-primary focus:ring-1 focus:ring-primary"
            type="text"
            placeholder="Objet de votre demande"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-on-surface-variant"
            >Message</label
          >
          <textarea
            [(ngModel)]="message"
            rows="5"
            class="bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface outline-none focus:border-primary focus:ring-1 focus:ring-primary"
          ></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button
            (click)="contactWhatsapp()"
            class="w-full bg-[#25D366] text-white font-semibold py-4 rounded-2xl shadow-sm hover:opacity-95 transition-opacity flex items-center justify-center gap-2"
          >
            <span class="material-symbols-outlined">chat</span>
            WhatsApp
          </button>
          <button
            (click)="callSupport()"
            class="w-full bg-secondary text-on-secondary font-semibold py-4 rounded-2xl shadow-sm hover:opacity-95 transition-opacity flex items-center justify-center gap-2"
          >
            <span class="material-symbols-outlined">call</span>
            Appeler
          </button>
        </div>

        <button
          (click)="sendRequest()"
          class="w-full bg-primary text-on-primary font-bold py-4 rounded-2xl shadow-md hover:opacity-95 transition-opacity"
        >
          Envoyer la demande
        </button>
      </div>
    </section>
  </main>
</ion-content>
