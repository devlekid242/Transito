<!-- En-tête repensée (style bouton retour circulaire et ombre douce) -->
<ion-header class="ion-no-border">
  <div class="bg-white flex items-center justify-between px-6 h-16 max-w-md mx-auto sticky top-0 z-40 shadow-[0_4px_20px_rgba(0,0,0,0.04)]">
    <button (click)="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1 class="text-lg font-bold text-gray-900">Support client</h1>
    <div class="w-10"></div> <!-- Spacer pour centrer le titre -->
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="bg-white">
  <div class="w-full max-w-md mx-auto px-6 py-8 flex flex-col min-h-full">
    
    <!-- Hero Section avec Icône -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-primary/10 text-primary flex items-center justify-center mb-4">
        <i class="fa-solid fa-headset text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Comment pouvons-nous aider ?</h2>
      <p class="text-sm text-gray-500">
        Notre équipe est disponible 24/7 pour répondre à toutes vos questions.
      </p>
    </div>

    <!-- Formulaire de contact -->
    <div class="flex-1 flex flex-col gap-5">
      
      <!-- Input Sujet -->
      <div class="flex items-center w-full bg-surface-container-lowest border border-outline-variant rounded-2xl px-4 py-4 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3">
        <i class="fa-solid fa-pen text-outline text-base"></i>
        <input
          [(ngModel)]="subject"
          type="text"
          placeholder="Sujet de votre demande"
          class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-outline/60 outline-none focus:ring-0 text-base"
        />
      </div>

      <!-- Textarea Message -->
      <div class="flex w-full bg-surface-container-lowest border border-outline-variant rounded-2xl px-4 py-4 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3">
        <i class="fa-solid fa-message text-outline text-base mt-1"></i>
        <textarea
          [(ngModel)]="message"
          rows="4"
          placeholder="Décrivez votre problème en détail..."
          class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-outline/60 outline-none focus:ring-0 text-base resize-none"
        ></textarea>
      </div>

      <!-- Bouton Envoyer principal -->
      <button
        (click)="sendRequest()"
        [disabled]="isSubmitting || !subject || !message"
        class="w-full bg-primary text-white font-bold py-3.5 rounded-[9px] disabled:opacity-50 shadow-sm transition-all mt-2"
      >
        <span *ngIf="!isSubmitting">Envoyer la demande</span>
        <ion-spinner *ngIf="isSubmitting" name="dots" color="light"></ion-spinner>
      </button>
      
      <!-- Séparateur élégant -->
      <div class="flex items-center gap-4 my-2">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Ou contactez-nous</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Boutons d'appels rapides (WhatsApp & Téléphone) -->
      <div class="grid grid-cols-2 gap-3 pb-8">
        <button
          (click)="contactWhatsapp()"
          class="w-full bg-[#25D366]/10 text-[#25D366] font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-[#25D366]/20 transition-colors"
        >
          <i class="fa-brands fa-whatsapp text-lg"></i>
          WhatsApp
        </button>
        <button
          (click)="callSupport()"
          class="w-full bg-gray-100 text-gray-700 font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-gray-200 transition-colors"
        >
          <i class="fa-solid fa-phone"></i>
          Appeler
        </button>
      </div>
      
    </div>
  </div>
</ion-content>
