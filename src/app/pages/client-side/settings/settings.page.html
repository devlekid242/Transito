<ion-header class="ion-no-border">
  <div
    class="bg-surface-container-lowest flex justify-between items-center px-container-padding py-3 sticky top-0 z-40 shadow-sm border-b border-surface-variant/40"
  >
    <button
      (click)="goBack()"
      class="flex items-center gap-2 text-secondary hover:bg-surface-container-low transition-colors duration-200 px-2 py-1.5 rounded-lg active-scale"
    >
      <i class="fa-solid fa-arrow-left"></i>
      <span class="text-body-md font-semibold">Retour</span>
    </button>
    <div class="font-sans text-lg font-bold text-secondary">Paramètres</div>
    <div class="w-10"></div>
  </div>
</ion-header>

<ion-content class="bg-background">
  <main
    class="w-full max-w-[480px] mx-auto px-container-padding py-stack-lg pb-24"
  >
    <section
      class="bg-surface-container-lowest rounded-2xl border border-surface-variant shadow-[0_4px_20px_rgba(15,23,42,0.05)] overflow-hidden"
    >
      <div
        class="p-stack-md border-b border-surface-variant/40 bg-surface-container-lowest"
      >
        <h2 class="text-lg font-semibold text-on-surface">
          Préférences générales
        </h2>
        <p class="text-sm text-on-surface-variant">
          Personnalisez votre expérience Transito.
        </p>
      </div>

      <div class="p-stack-md flex flex-col gap-4">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-semibold text-on-surface">Notifications</p>
            <p class="text-xs text-on-surface-variant">
              Recevoir des alertes de trajet et de promotions.
            </p>
          </div>
          <ion-toggle
            [checked]="notificationsEnabled"
            (ionChange)="toggleNotifications($event)"
            color="secondary"
          ></ion-toggle>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-on-surface-variant"
            >Langue</label
          >
          <select
            [(ngModel)]="language"
            class="bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface outline-none focus:border-primary focus:ring-1 focus:ring-primary"
          >
            <option>Français</option>
            <option>Anglais</option>
          </select>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-on-surface-variant"
            >Devise</label
          >
          <select
            [(ngModel)]="currency"
            class="bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-sm text-on-surface outline-none focus:border-primary focus:ring-1 focus:ring-primary"
          >
            <option>FCFA</option>
            <option>EUR</option>
            <option>USD</option>
          </select>
        </div>

        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-semibold text-on-surface">Mode sombre</p>
            <p class="text-xs text-on-surface-variant">
              Activer un thème plus sombre pour les voyages nocturnes.
            </p>
          </div>
          <ion-toggle [(ngModel)]="darkMode" color="secondary"></ion-toggle>
        </div>
      </div>
    </section>

      (click)="saveSettings()"
      class="w-full mt-6 bg-secondary text-on-secondary font-bold py-4 rounded-2xl shadow-md hover:opacity-95 active-scale transition-opacity"

      Enregistrer
    </button>
