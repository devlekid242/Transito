<ion-header class="ion-no-border">
  <div
    class="bg-surface-container-lowest flex justify-between items-center px-container-padding h-16 w-full sticky top-0 z-40 border-b border-surface-variant/40 shadow-sm transition-colors duration-200"
  >
    <button
      (click)="goBack()"
      class="flex items-center gap-2 text-secondary hover:bg-surface-container-low transition-colors duration-200 px-2 py-1.5 rounded-lg active-scale"
    >
      <i class="fa-solid fa-arrow-left"></i>
      <span class="text-body-md font-semibold">Retour</span>
    </button>
    <span class="font-sans text-base font-bold text-secondary tracking-tight">Sécurité du compte</span>
    <div class="w-16"></div>
  </div>
</ion-header>

<ion-content class="bg-background">
  <div class="w-full max-w-[480px] bg-surface min-h-screen mx-auto pb-28">
    <main class="max-w-[480px] px-container-padding pt-stack-lg flex flex-col gap-stack-lg pb-24 mx-auto">

      <!-- ===================== SKELETON LOADER ===================== -->
      <div *ngIf="isLoading" class="flex flex-col gap-stack-lg">
        <div class="bg-surface-container-lowest rounded-[2rem] p-6 soft-shadow border border-outline-variant/20 flex flex-col gap-4">
          <div class="h-4 bg-surface-container rounded w-48 animate-pulse"></div>
          <div *ngFor="let field of [1,2,3]" class="flex flex-col gap-2">
            <div class="h-3 bg-surface-container rounded w-32 animate-pulse"></div>
            <div class="h-12 bg-surface-container rounded-2xl w-full animate-pulse"></div>
          </div>
        </div>
        <div class="h-12 bg-surface-container rounded-2xl w-full animate-pulse"></div>
      </div>

      <!-- ===================== FORMULAIRE ===================== -->
      <form *ngIf="!isLoading" [formGroup]="passwordForm" (ngSubmit)="savePassword()" class="flex flex-col gap-stack-lg">

        <!-- Section Modification de mot de passe -->
        <section class="bg-surface-container-lowest rounded-[2rem] p-6 soft-shadow border border-outline-variant/20">
          <h2 class="text-sm font-headline-sm font-extrabold text-on-surface mb-6 flex items-center gap-2 tracking-tight">
            <i class="fa-solid fa-shield-halved text-secondary text-sm"></i>
            Modifier mon mot de passe
          </h2>

          <!-- Ancien mot de passe -->
          <div class="flex flex-col gap-1.5 mb-4">
            <label line-height="normal" for="oldPassword" class="text-[11px] font-bold text-on-surface-variant/70 uppercase tracking-wider ml-1">Ancien mot de passe *</label>
            <div class="relative flex items-center">
              <i class="fa-solid fa-lock absolute left-4 text-on-surface-variant/50 text-sm"></i>
              <input
                [type]="showOldPassword ? 'text' : 'password'"
                id="oldPassword"
                formControlName="oldPassword"
                placeholder="Entrez votre mot de passe actuel"
                class="w-full bg-surface-container-low border border-outline-variant/30 rounded-2xl pl-11 pr-12 py-3.5 text-sm text-on-surface font-semibold outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:font-medium placeholder:text-on-surface-variant/40"
              />
              <button 
                type="button"
                (click)="showOldPassword = !showOldPassword"
                class="absolute right-4 text-on-surface-variant/50 hover:text-on-surface transition-colors"
              >
                <i class="fa-solid" [ngClass]="showOldPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
            <span
              *ngIf="passwordForm.get('oldPassword')?.invalid && passwordForm.get('oldPassword')?.touched"
              class="text-[11px] text-red-500 font-semibold ml-1"
            >
              L'ancien mot de passe est obligatoire
            </span>
          </div>

          <hr class="border-outline-variant/20 my-5" />

          <!-- Nouveau mot de passe -->
          <div class="flex flex-col gap-1.5 mb-4">
            <label for="newPassword" class="text-[11px] font-bold text-on-surface-variant/70 uppercase tracking-wider ml-1">Nouveau mot de passe *</label>
            <div class="relative flex items-center">
              <i class="fa-solid fa-key absolute left-4 text-on-surface-variant/50 text-sm"></i>
              <input
                [type]="showNewPassword ? 'text' : 'password'"
                id="newPassword"
                formControlName="newPassword"
                placeholder="Minimum 6 caractères"
                class="w-full bg-surface-container-low border border-outline-variant/30 rounded-2xl pl-11 pr-12 py-3.5 text-sm text-on-surface font-semibold outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:font-medium placeholder:text-on-surface-variant/40"
              />
              <button 
                type="button"
                (click)="showNewPassword = !showNewPassword"
                class="absolute right-4 text-on-surface-variant/50 hover:text-on-surface transition-colors"
              >
                <i class="fa-solid" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
            <span
              *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched"
              class="text-[11px] text-red-500 font-semibold ml-1"
            >
              Le nouveau mot de passe doit contenir au moins 6 caractères
            </span>
          </div>

          <!-- Confirmer le nouveau mot de passe -->
          <div class="flex flex-col gap-1.5">
            <label for="confirmPassword" class="text-[11px] font-bold text-on-surface-variant/70 uppercase tracking-wider ml-1">Confirmer le nouveau mot de passe *</label>
            <div class="relative flex items-center">
              <i class="fa-solid fa-check-double absolute left-4 text-on-surface-variant/50 text-sm"></i>
              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                id="confirmPassword"
                formControlName="confirmPassword"
                placeholder="Répétez le nouveau mot de passe"
                class="w-full bg-surface-container-low border border-outline-variant/30 rounded-2xl pl-11 pr-12 py-3.5 text-sm text-on-surface font-semibold outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:font-medium placeholder:text-on-surface-variant/40"
              />
              <button 
                type="button"
                (click)="showConfirmPassword = !showConfirmPassword"
                class="absolute right-4 text-on-surface-variant/50 hover:text-on-surface transition-colors"
              >
                <i class="fa-solid" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
            <span
              *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched"
              class="text-[11px] text-red-500 font-semibold ml-1"
            >
              Les nouveaux mots de passe ne correspondent pas
            </span>
          </div>
        </section>

        <!-- Boutons d'action -->
        <section class="flex flex-col gap-3">
          <button
            type="submit"
            [disabled]="passwordForm.invalid || isSaving"
            class="w-full bg-primary text-on-primary font-bold text-sm py-4 rounded-2xl shadow-lg shadow-primary/10 active:scale-[0.98] hover:brightness-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
          >
            <span *ngIf="!isSaving">Mettre à jour le mot de passe</span>
            <span *ngIf="isSaving" class="flex items-center justify-center gap-2">
              <i class="fa-solid fa-spinner fa-spin text-sm"></i>
              Mise à jour...
            </span>
          </button>

          <button
            type="button"
            (click)="goBack()"
            class="w-full bg-surface-container-low text-on-surface font-bold text-sm py-4 rounded-2xl hover:bg-surface-container transition-colors active:scale-[0.98] border border-outline-variant/30"
          >
            Annuler
          </button>
        </section>
      </form>
    </main>
  </div>
</ion-content>
