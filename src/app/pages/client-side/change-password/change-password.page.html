<ion-header class="ion-no-border">
  <div class="bg-white flex items-center justify-between px-6 h-16 max-w-md mx-auto sticky top-0 z-40 shadow-[0_4px_20px_rgba(0,0,0,0.04)]">
    <button (click)="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1 class="text-lg font-bold text-gray-900">Sécurité</h1>
    <div class="w-10"></div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="bg-white">
  <div class="w-full max-w-md mx-auto px-6 py-8 pb-28 min-h-full">

    <form *ngIf="!isLoading" [formGroup]="passwordForm" (ngSubmit)="savePassword()" class="flex flex-col gap-6">

      <div class="flex flex-col items-center text-center mb-4">
        <div class="w-16 h-16 rounded-full bg-gray-50 text-gray-800 flex items-center justify-center mb-4">
          <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-1">Modifier le mot de passe</h2>
        <p class="text-sm text-gray-500">Assurez-vous de choisir un mot de passe robuste.</p>
      </div>

      <!-- Ancien mot de passe -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider ml-1">Mot de passe actuel</label>
        <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-gray-800 focus-within:ring-4 focus-within:ring-gray-800/10 transition-all gap-3 relative">
          <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
          <input [type]="showOldPassword ? 'text' : 'password'" formControlName="oldPassword" placeholder="Saisissez votre mot de passe" class="w-full bg-transparent border-0 py-3 pr-8 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          <button type="button" (click)="showOldPassword = !showOldPassword" class="absolute right-4 text-gray-400 hover:text-gray-700">
            <i class="fa-solid" [ngClass]="showOldPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="h-px bg-gray-100 my-2"></div>

      <!-- Nouveau mot de passe -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider ml-1">Nouveau mot de passe</label>
        <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3 relative">
          <i class="fa-solid fa-key text-gray-400 text-sm"></i>
          <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword" placeholder="Minimum 6 caractères" class="w-full bg-transparent border-0 py-3 pr-8 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          <button type="button" (click)="showNewPassword = !showNewPassword" class="absolute right-4 text-gray-400 hover:text-gray-700">
            <i class="fa-solid" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <span *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched" class="text-[11px] text-red-500 font-bold ml-1">Trop court (min. 6).</span>
      </div>

      <!-- Confirmer le mot de passe -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider ml-1">Confirmer le mot de passe</label>
        <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-1 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3 relative">
          <i class="fa-solid fa-check-double text-gray-400 text-sm"></i>
          <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Répétez le mot de passe" class="w-full bg-transparent border-0 py-3 pr-8 text-gray-900 placeholder:text-gray-400 outline-none focus:ring-0 text-sm font-medium" />
          <button type="button" (click)="showConfirmPassword = !showConfirmPassword" class="absolute right-4 text-gray-400 hover:text-gray-700">
            <i class="fa-solid" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <span *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched" class="text-[11px] text-red-500 font-bold ml-1">Les mots de passe ne correspondent pas.</span>
      </div>

      <!-- Boutons -->
      <section class="flex flex-col gap-3 mt-6">
        <button type="submit" [disabled]="passwordForm.invalid || isSaving" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-[9px] shadow-sm transition-all active:scale-[0.98] disabled:opacity-50 flex items-center justify-center gap-2">
          <span *ngIf="!isSaving">Mettre à jour le mot de passe</span>
          <ion-spinner *ngIf="isSaving" name="dots" color="light"></ion-spinner>
        </button>
      </section>
    </form>
  </div>
</ion-content>
