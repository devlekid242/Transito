<ion-content [fullscreen]="true" class="bg-background">
  <div class="min-h-full px-6 py-12 bg-background flex flex-col justify-center max-w-md mx-auto">
    <div class="w-14 h-14 rounded-2xl bg-primary/10 text-primary flex items-center justify-center mb-5">
      <i class="fa-solid fa-user-plus text-xl"></i>
    </div>

    <h1 class="text-3xl font-extrabold text-secondary">Bienvenue sur Transito</h1>
    <p class="text-sm text-on-surface-variant mt-2 mb-8">
      Votre numéro <strong>{{ phoneNumber }}</strong> a été vérifié. Il nous manque seulement votre nom pour créer votre profil.
    </p>

    <div class="space-y-2 mb-5">
      <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Nom complet</label>
      <div class="relative flex items-center">
        <i class="fa-solid fa-user absolute left-4 text-outline text-base"></i>
        <input
          [(ngModel)]="fullName"
          type="text"
          autocomplete="name"
          placeholder="Ex : Jean Packa"
          class="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl pl-12 pr-4 py-4 outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all text-base"
          (keyup.enter)="submit()"
        />
      </div>
    </div>

    <div *ngIf="error" class="bg-red-50 text-red-600 text-sm p-4 rounded-xl mb-4">{{ error }}</div>

    <button
      (click)="submit()"
      [disabled]="loading"
      class="w-full bg-primary text-white font-bold py-4 rounded-2xl disabled:opacity-60"
    >
      <span *ngIf="!loading">Créer mon compte</span>
      <ion-spinner *ngIf="loading" name="crescent" color="light"></ion-spinner>
    </button>
  </div>
</ion-content>
