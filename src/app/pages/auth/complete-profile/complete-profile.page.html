<ion-content [fullscreen]="true" class="bg-white">
  <div class="flex flex-col h-full justify-between max-w-md mx-auto pt-12 px-6">
    
    <!-- En-tête avec Icône -->
    <div class="flex flex-col items-center">
      <div class="w-16 h-16 rounded-full bg-primary/10 text-primary flex items-center justify-center mb-6">
        <i class="fa-solid fa-user-pen text-2xl"></i>
      </div>

      <h1 class="text-2xl font-bold text-center text-gray-900 mb-2">Informations du profil</h1>
      <p class="text-center text-gray-500 text-sm mb-10 px-4">
        Veuillez saisir votre nom complet pour finaliser la création de votre compte.
      </p>

      <!-- Input Nom complet -->
      <div class="flex items-center w-full border-b-2 border-primary/50 focus-within:border-primary transition-colors py-2 px-1">
        <input
          [(ngModel)]="fullName"
          type="text"
          autocomplete="name"
          placeholder="Ex : Jean Packa"
          class="w-full bg-transparent outline-none text-lg text-gray-900 placeholder:text-gray-300"
          (keyup.enter)="submit()"
        />
      </div>
    </div>

    <!-- Action du bas -->
    <div class="pb-8 flex flex-col items-center">
      <button
        (click)="submit()"
        [disabled]="loading"
        class="bg-primary text-white font-bold py-3 px-12 rounded-full disabled:opacity-50"
      >
        <span *ngIf="!loading">Terminer</span>
        <ion-spinner *ngIf="loading" name="dots" color="light"></ion-spinner>
      </button>
    </div>
    
  </div>
</ion-content>
