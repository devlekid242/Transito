<ion-content [fullscreen]="true" class="bg-white">
  <div class="flex flex-col h-full max-w-md mx-auto pt-12 px-6">
    
    <!-- En-tête avec Icône -->
    <div class="flex flex-col items-center text-center mb-10">
      <div class="w-16 h-16 rounded-full bg-primary/10 text-primary flex items-center justify-center mb-6">
        <i class="fa-solid fa-shield-halved text-2xl"></i>
      </div>

      <h1 class="text-2xl font-bold text-gray-900 mb-2">Code de vérification</h1>
      <p class="text-sm text-gray-500">
        Code envoyé au <span class="font-bold text-gray-900">+242 {{ phoneNumber }}</span>.
        <button routerLink="/auth/login" class="text-primary ml-1 font-medium underline">Modifier</button>
      </p>
    </div>

    <!-- Input OTP épuré -->
    <div class="flex flex-col items-center mb-8">
      <input
        [(ngModel)]="code"
        type="tel"
        inputmode="numeric"
        maxlength="6"
        placeholder="— — —   — — —"
        class="w-full text-center text-3xl font-bold tracking-[0.5em] text-gray-900 bg-transparent border-b-2 border-gray-200 focus:border-primary outline-none py-3 transition-colors placeholder:text-gray-300 placeholder:font-light"
        (keyup.enter)="verify()"
      />
      <p class="text-xs text-gray-400 mt-4">Saisissez le code à 6 chiffres</p>
    </div>

    <!-- Bouton principal -->
    <button
      (click)="verify()"
      [disabled]="loading"
      class="w-full bg-primary text-white font-bold py-3 rounded-full disabled:opacity-50 mb-6"
    >
      <span *ngIf="!loading">Vérifier</span>
      <ion-spinner *ngIf="loading" name="dots" color="light"></ion-spinner>
    </button>

    <!-- Renvoyer le SMS -->
    <button
      (click)="resend()"
      [disabled]="countdown>0||loading"
      class="text-gray-500 font-medium flex items-center justify-center gap-2 py-2"
    >
      <i class="fa-solid fa-comment-sms text-gray-400"></i>
      {{ countdown>0 ? 'Renvoyer le SMS dans '+countdown+'s' : 'Renvoyer le SMS' }}
    </button>
  </div>
</ion-content>
