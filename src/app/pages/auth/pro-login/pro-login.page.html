<ion-content [fullscreen]="true" class="bg-background"
  ><div
    class="min-h-full px-6 py-12 bg-background flex flex-col justify-center max-w-md mx-auto"
  >
    <button (click)="back()" class="self-start text-on-surface-variant mb-8">
      <i class="fa-solid fa-arrow-left mr-2"></i>Retour
    </button>
    <h1 class="text-3xl font-extrabold text-secondary">Accès professionnel</h1>
    <p class="text-sm text-on-surface-variant mt-2 mb-8">
      Connexion des agents et partenaires Transito.
    </p>
    <div class="space-y-2 mb-5">
      <label
        class="text-xs font-bold text-on-surface-variant uppercase tracking-wider"
        >Téléphone</label
      ><input
        [(ngModel)]="phoneNumber"
        type="tel"
        placeholder="06 000 0000"
        class="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl px-4 py-4 text-on-surface outline-none focus:border-primary"
      />
    </div>
    <div class="space-y-2 mb-5">
      <label
        class="text-xs font-bold text-on-surface-variant uppercase tracking-wider"
        >Mot de passe</label
      ><input
        [(ngModel)]="password"
        type="password"
        placeholder="••••••••"
        class="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl px-4 py-4 text-on-surface outline-none focus:border-primary"
      />
    </div>
    <div
      *ngIf="error"
      class="bg-red-50 text-red-600 text-sm p-4 rounded-xl mb-4"
    >
      {{ error }}
    </div>
    <button
      (click)="login()"
      [disabled]="loading"
      class="w-full bg-primary text-white font-bold py-4 rounded-2xl disabled:opacity-60"
    >
      <span *ngIf="!loading">Se connecter</span
      ><ion-spinner *ngIf="loading" name="crescent" color="light"></ion-spinner>
    </button></div
></ion-content>
