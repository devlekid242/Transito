<ion-content [fullscreen]="true" class="bg-white">
  <div class="flex flex-col h-full justify-between py-8 max-w-md mx-auto pt-12 px-6">
    <!-- En-tête avec Icône -->
    <div class="flex flex-col items-center">
      <div
        class="w-16 h-16 rounded-full bg-primary/10 text-primary flex items-center justify-center mb-6"
      >
        <i class="fa-solid fa-mobile-screen-button text-2xl"></i>
      </div>

      <h1 class="text-2xl font-bold text-center text-gray-900 mb-2">
        Saisissez votre numéro
      </h1>
      <p class="text-center text-gray-500 text-sm mb-10 px-2">
        Transito va vérifier votre numéro. Aucun mot de passe n'est requis.
      </p>

      <!-- Input style WhatsApp -->
      <div
        class="flex items-center w-full bg-surface-container-lowest border border-outline-variant rounded-2xl px-4 py-4 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all gap-3"
      >
        <i class="fa-solid fa-phone text-outline text-base"></i>
        <span
          class="text-base font-bold text-secondary border-r border-outline-variant pr-3 select-none"
          >+242</span
        >
        <input
          [ngModel]="phoneNumber()"
          (ngModelChange)="phoneNumber.set($event)"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          maxlength="12"
          placeholder="06 000 0000"
          class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-outline/60 outline-none focus:ring-0 text-base"
          (keyup.enter)="requestOtp()"
        />
      </div>
    </div>

    <!-- Actions du bas -->
    <div class="pb-8 flex flex-col items-center gap-6">
      <button
        (click)="requestOtp()"
        [disabled]="loading()"
        class="bg-primary text-white w-full font-bold py-3 px-12 rounded-full disabled:opacity-50 transition-opacity"
      >
        <span *ngIf="!loading()">Suivant</span>
        <ion-spinner *ngIf="loading()" name="dots" color="light"></ion-spinner>
      </button>

      <button
        (click)="goToProfessionalLogin()"
        class="text-sm text-gray-500 font-medium"
      >
        Accès agent / partenaire
      </button>
    </div>
  </div>
</ion-content>
