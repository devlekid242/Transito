<ion-content [fullscreen]="true">
  <div class="h-full w-full flex flex-col bg-background overflow-hidden px-6 pt-8">
    
   <!-- Barre supérieure : Logo / Nom de l'application -->
    <div class="flex items-center gap-2 pt-4 mb-4">
      <!-- Remplacer le <div> ci-dessous par un <img src="assets/logo.png" class="w-8 h-8 object-contain" /> si tu as une image -->
      <img src="assets/images/logo-full-trans.png" alt="Logo" class="h-11 object-contain" />
    </div>
    
    <!-- Illustration -->
    <div class="flex-1 flex items-center justify-center px-6 pt-8 min-h-0">
      <div class="w-full flex items-center justify-center">
        <img
          src="assets/images/onboarding.png"
          alt="Transito"
          class="w-full h-full object-cover object-center"
        />
      </div>
    </div>

    <!-- Présentation -->
    <div class="shrink-0 px-6 mb-16 relative text-center">
      <h1 class="text-[26px] font-bold leading-tight text-on-background m-0">
        Bienvenue sur Transito
      </h1>

      <p
        class="text-[14px] leading-[1.5] text-on-surface-variant max-w-[300px] mx-auto mt-2 mb-0"
      >
        Réservez vos billets de bus interurbain partout au Congo, en toute
        simplicité.
      </p>
    </div>

    <!-- Consentement + bouton -->
    <div class="shrink-0 px-4 pb-5">
      <div class="w-full max-w-[360px] mx-auto text-center">
        <p class="text-[10px] leading-[1.45] text-on-surface-variant m-0 px-4">
          En continuant, vous acceptez notre
          <button
            type="button"
            (click)="openPrivacyPolicy()"
            class="text-primary font-medium underline"
          >
            politique de confidentialité</button
          >.
        </p>

        <button
          type="button"
          (click)="finishOnboarding()"
          [disabled]="loading()"
          class="w-full h-12 mt-4 px-5 bg-primary text-white font-semibold text-[13px] rounded-[9px] disabled:opacity-60 disabled:pointer-events-none transition-all flex items-center justify-center gap-2"
        >
          <span *ngIf="!loading()">Accepter &amp; commencer</span>

          <ion-spinner
            *ngIf="loading()"
            name="dots"
            color="light"
          ></ion-spinner>

          <i
            *ngIf="!loading()"
            class="fa-solid fa-arrow-right text-sm"
            aria-hidden="true"
          ></i>
        </button>
      </div>
    </div>
  </div>
</ion-content>
